<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오늘의 학습 계획 - 페이지 분배 플래너</title>
    
    <style>
        /* CSS는 이전과 동일합니다. */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.1rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: white;
        }

        .logo {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            color: white;
        }

        .headline {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease-out;
        }

        .subtext {
            font-size: 1.5rem;
            margin-bottom: 2.5rem;
            opacity: 0.95;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .tab-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .tab-btn {
            padding: 0.8rem 2rem;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
        }

        .plan-form {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .plan-form input,
        .plan-form textarea,
        .plan-form select {
            width: 100%;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
        }

        .plan-form textarea {
            resize: vertical;
            min-height: 80px;
        }

        .plan-form input::placeholder,
        .plan-form textarea::placeholder {
            color: rgba(102, 126, 234, 0.6);
        }

        .plan-form input:focus,
        .plan-form textarea:focus,
        .plan-form select:focus {
            border-color: white;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .api-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: white;
            text-align: left;
        }
        
        .btn {
            width: 100%;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .btn.primary {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn.primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn.primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn.ai-btn {
            /* 색상 변경: AI가 아닌 계산 버튼으로 변경 */
            background: linear-gradient(135deg, #2af598 0%, #009efd 100%);
            color: white;
            margin-top: 1rem;
        }

        .btn.ai-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #009efd 0%, #2af598 100%);
        }

        .loading {
            display: none;
            margin-top: 1rem;
            color: white;
            font-size: 1rem;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .saved-plans {
            margin-top: 2rem;
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .plan-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            text-align: left;
        }

        .plan-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .plan-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .plan-subject {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: white;
        }

        .plan-content {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .delete-btn {
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .footer {
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .headline {
                font-size: 2.5rem;
            }

            .subtext {
                font-size: 1.2rem;
            }

            .plan-form {
                padding: 2rem;
            }

            .tab-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="main.html" class="back-button" aria-label="대시보드로 돌아가기">← 돌아가기</a>
        <div class="logo">학습 계획</div>
        <a href="schedule.html/schedule.html" class="back-button" aria-label="수행평가 일정 보기">📅 일정 보기</a>
    </div>

    <section class="hero">
        <h1 class="headline">오늘의 학습 계획</h1>
        <p class="subtext">하루의 목표를 세워보세요 ✍️</p>

        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('manual')">직접 작성</button>
            <button class="tab-btn" onclick="switchTab('calculate')">📊 페이지 분배 계산</button>
        </div>

        <form class="plan-form" id="planForm">
            <div class="form-section active" id="manualSection">
                <input type="text" id="subject" placeholder="공부할 과목을 입력하세요" required />
                <input type="text" id="content" placeholder="공부할 내용을 입력하세요" required />
                <button type="submit" class="btn primary">저장하기</button>
            </div>

            <div class="form-section" id="calculateSection">
                <input type="text" id="calcSubject" placeholder="과목 이름 (예: 미적분학)" required />
                <input type="number" id="startPage" placeholder="시작 페이지 (예: 10)" required min="1" />
                <input type="number" id="endPage" placeholder="마지막 페이지 (예: 300)" required min="1" />
                <input type="number" id="studyDays" placeholder="총 학습 기간 (일수, 예: 7)" required min="1" />
                <label for="startDate" style="display:block; text-align:left; color: rgba(255,255,255,0.9); margin: 0.5rem 0 0.2rem; font-weight:600;">시작 날짜</label>
                <input type="date" id="startDate" required />
                
                <button type="button" class="btn ai-btn" id="calculateBtn" onclick="calculatePlan()">
                    📊 학습량 분배하기
                </button>

                <div class="loading" id="loading">
                    </div>
            </div>
        </form>

        <div class="saved-plans" id="savedPlans"></div>
    </section>

    <footer class="footer">© 2025 청운재 앱</footer>

    <script>
        // API 키와 Gemini SDK 관련 코드는 이제 모두 삭제되었습니다.
        
        const STORAGE_KEY = 'studyPlans';
        const planForm = document.getElementById('planForm');
        const savedPlansDiv = document.getElementById('savedPlans');
        let plans = [];
        let currentTab = 'manual';

        function loadPlans() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                plans = stored ? JSON.parse(stored) : [];
                if (!Array.isArray(plans)) {
                    plans = [];
                }
                plans = plans.map(plan => ({
                    ...plan,
                    scheduleEntries: Array.isArray(plan.scheduleEntries) ? plan.scheduleEntries : [],
                    type: plan.type || 'manual',
                    createdAt: plan.createdAt || new Date().toISOString()
                }));
            } catch (error) {
                console.error('학습 계획 로드 실패:', error);
                plans = [];
            }
        }

        function savePlans() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(plans));
            } catch (error) {
                console.error('학습 계획 저장 실패:', error);
            }
        }

        // 탭 전환 (탭 이름 'ai' 대신 'calculate' 사용)
        function switchTab(tab) {
            currentTab = tab;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const targetBtn = document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`);
            if (targetBtn) {
                targetBtn.classList.add('active');
            }
            
            document.querySelectorAll('.form-section').forEach(section => {
                section.classList.remove('active');
            });
            
            if (tab === 'manual') {
                document.getElementById('manualSection').classList.add('active');
            } else {
                document.getElementById('calculateSection').classList.add('active');
            }
        }

        // 직접 작성 폼 제출 (기존 유지)
        planForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (currentTab === 'manual') {
                const subject = document.getElementById('subject').value.trim();
                const content = document.getElementById('content').value.trim();
                
                if (subject && content) {
                    plans.unshift({ 
                        subject, 
                        content, 
                        id: Date.now(),
                        type: 'manual',
                        scheduleEntries: [],
                        createdAt: new Date().toISOString()
                    });
                    
                    document.getElementById('subject').value = '';
                    document.getElementById('content').value = '';
                    
                    savePlans();
                    displayPlans();
                }
            }
        });

        // 📊 학습량 분배 계산 함수 (새로 작성된 부분)
        function calculatePlan() {
            const subject = document.getElementById('calcSubject').value.trim();
            const startPage = parseInt(document.getElementById('startPage').value);
            const endPage = parseInt(document.getElementById('endPage').value);
            const studyDays = parseInt(document.getElementById('studyDays').value);
            const startDateValue = document.getElementById('startDate').value;

            if (!subject || !startDateValue || isNaN(startPage) || isNaN(endPage) || isNaN(studyDays) || startPage <= 0 || endPage <= 0 || studyDays <= 0 || endPage < startPage) {
                alert('과목, 시작/마지막 페이지, 학습 기간, 시작 날짜를 올바르게 입력해주세요. (마지막 페이지는 시작 페이지보다 커야 합니다.)');
                return;
            }

            const startDate = new Date(startDateValue);
            if (Number.isNaN(startDate.getTime())) {
                alert('유효한 시작 날짜를 선택해주세요.');
                return;
            }

            const totalPages = endPage - startPage + 1; // 총 페이지 수 계산
            const pagesPerDay = Math.floor(totalPages / studyDays); // 일일 할당 페이지 (정수)
            let remainder = totalPages % studyDays; // 나머지 페이지

            let currentDayPage = startPage;
            let planContent = `## 📖 ${subject} 학습 분배 계획 (총 ${studyDays}일)\n\n`;
            planContent += `* **총 페이지 수:** ${totalPages}페이지 (P.${startPage} ~ P.${endPage})\n`;
            planContent += `* **일일 최소 분량:** ${pagesPerDay}페이지\n`;
            planContent += `* **시작 날짜:** ${formatKoreanDate(startDate)}\n`;
            planContent += `* **나머지 처리:** ${remainder}일은 1페이지 추가 할당\n\n`;
            planContent += "| 일차 | 분량 | 학습 페이지 |\n";
            planContent += "|---|---|---|\n";

            const scheduleEntries = [];
            const startDateMs = startDate.getTime();

            for (let i = 1; i <= studyDays; i++) {
                let dailyPages = pagesPerDay;
                if (remainder > 0) {
                    dailyPages += 1; // 나머지 페이지를 앞에서부터 하루에 1페이지씩 추가
                    remainder--;
                }
                
                const start = currentDayPage;
                const end = currentDayPage + dailyPages - 1;

                planContent += `| ${i}일차 | ${dailyPages}페이지 | P.${start} ~ P.${end} |\n`;
                const currentDate = new Date(startDateMs + (i - 1) * 24 * 60 * 60 * 1000);
                scheduleEntries.push({
                    date: currentDate.toISOString().slice(0, 10),
                    label: `${i}일차`,
                    detail: `P.${start} ~ P.${end} (${dailyPages}p)`
                });
                currentDayPage = end + 1;
            }

            plans.unshift({
                subject: `${subject} (페이지 분배)`,
                content: planContent,
                id: Date.now(),
                type: 'calc',
                scheduleEntries,
                createdAt: new Date().toISOString()
            });

            savePlans();
            displayPlans();

            // 입력 필드 초기화
            document.getElementById('calcSubject').value = '';
            document.getElementById('startPage').value = '';
            document.getElementById('endPage').value = '';
            document.getElementById('studyDays').value = '';
            document.getElementById('startDate').value = '';
        }

        function formatKoreanDate(date) {
            return `${date.getFullYear()}년 ${String(date.getMonth() + 1).padStart(2, '0')}월 ${String(date.getDate()).padStart(2, '0')}일`;
        }


        function displayPlans() {
            if (!plans.length) {
                savedPlansDiv.innerHTML = '<p style="color: rgba(255,255,255,0.85); text-align:center;">저장된 학습 계획이 아직 없어요. 직접 작성하거나 페이지 분배 기능을 사용해보세요!</p>';
                return;
            }

            savedPlansDiv.innerHTML = plans.map(plan => `
                <div class="plan-item">
                    <span class="plan-badge">${plan.type === 'calc' ? '📊 계산' : '✍️ 직접'}</span>
                    <div class="plan-subject">📚 ${plan.subject}</div>
                    <div class="plan-content">${plan.content}</div>
                    <button class="delete-btn" onclick="deletePlan(${plan.id})">삭제</button>
                </div>
            `).join('');
        }

        function deletePlan(id) {
            plans = plans.filter(plan => plan.id !== id);
            savePlans();
            displayPlans();
        }

        window.deletePlan = deletePlan;

        loadPlans();
        displayPlans();
    </script>
</body>
</html>
