<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수행평가 일정</title>
  <style>
    body{
      margin:0;
      padding:0;
      font-family:"Batang", serif;
      background:linear-gradient(160deg,#5a27ff,#a46bff);
      color:#1c1d1f;
    }
    header{
      font-size:28px;
      font-weight:700;
      padding:28px;
      color:white;
    }
    .month-header{
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:28px;
      padding:10px 0;
      font-weight:600;
      color:white;
      gap:24px;
    }
    .arrow{
      font-size:30px;
      padding:0 12px;
      cursor:pointer;
      user-select:none;
      color:white;
      transition:.2s;
    }
    .arrow:hover{ opacity:0.7; }

    .calendar-box{
      width:92%;
      max-width:900px;
      margin:20px auto;
      background:rgba(255,255,255,0.85);
      backdrop-filter:blur(8px);
      border-radius:24px;
      padding:30px;
      box-shadow:0 6px 30px rgba(0,0,80,0.25);
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:18px;
      text-align:center;
    }
    th{
      padding:12px 0;
      font-weight:700;
      color:#4b4c4e;
    }
    td{ padding:6px; position:relative; vertical-align:top; }

    .day-box{
      background:white;
      min-height:110px;
      border-radius:14px;
      border:1px solid #e0e0e0;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
      padding:8px;
      transition:border-color .2s, box-shadow .2s;
      display:flex;
      flex-direction:column;
      position:relative;
    }
    .day-num{
      font-size:16px;
      font-weight:700;
      color:#333;
    }

    .day-box.has-plan{
      border-color:#6c5ce7;
      box-shadow:0 4px 14px rgba(108,92,231,0.25);
    }

    .clear-btn{
      position:absolute;
      top:6px;
      right:6px;
      width:20px;
      height:20px;
      border-radius:50%;
      background:rgba(108,92,231,0.15);
      border:1px solid rgba(108,92,231,0.35);
      color:#5a27ff;
      font-size:14px;
      line-height:18px;
      text-align:center;
      cursor:pointer;
      transition:all .2s;
      display:none;
    }

    .day-box.has-plan .clear-btn{
      display:block;
    }

    .clear-btn:hover{
      background:#5a27ff;
      color:white;
      border-color:#5a27ff;
    }

    .task-list{
      list-style:none;
      margin:6px 0 0;
      padding:0;
      font-size:13px;
      color:#4b4c4e;
      text-align:left;
      flex:1;
      overflow-y:auto;
      max-height:88px;
    }

    .task-list li{
      background:rgba(108,92,231,0.12);
      border-radius:8px;
      padding:4px 6px;
      margin-top:4px;
      line-height:1.4;
    }

    .task-list li:first-child{
      margin-top:0;
    }

    .task-list li strong{
      display:block;
      font-weight:700;
      color:#5a27ff;
      margin-bottom:2px;
    }

    @media (max-width: 768px){
      header{ font-size:24px; padding:20px; }
      .month-header{ font-size:22px; }
      table{ font-size:16px; }
      .calendar-box{ padding:20px; }
      .day-box{ min-height:100px; }
    }
  </style>
</head>
<body>

  <header>수행평가 일정</header>

  <div class="month-header">
    <div class="arrow" onclick="changeMonth(-1)">◀</div>
    <div id="monthTitle"></div>
    <div class="arrow" onclick="changeMonth(1)">▶</div>
  </div>

  <div class="calendar-box">
    <div id="calendar"></div>
  </div>

  <script>
    const PLAN_STORAGE_KEY = 'studyPlans';

    function escapeHTML(value){
      return String(value ?? '').replace(/[&<>"']/g, (match) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[match] || match));
    }

    function loadPlanEntries(){
      try{
        const raw = localStorage.getItem(PLAN_STORAGE_KEY);
        if(!raw){
          return {};
        }

        const parsed = JSON.parse(raw);
        if(!Array.isArray(parsed)){
          return {};
        }

        const map = {};
        parsed.forEach((plan) => {
          if(!plan || !Array.isArray(plan.scheduleEntries)){
            return;
          }

          plan.scheduleEntries.forEach((entry) => {
            if(!entry || !entry.date){
              return;
            }
            const key = entry.date;
            if(!map[key]){
              map[key] = [];
            }
            map[key].push({
              subject: plan.subject || '학습 계획',
              label: entry.label || '',
              detail: entry.detail || ''
            });
          });
        });

        return map;
      }catch(error){
        console.error('학습 계획 데이터를 불러오는 중 오류가 발생했습니다:', error);
        return {};
      }
    }

    function generateCalendar(year, month){
      const date = new Date(year, month - 1, 1);
      const title = `${year}년 ${month}월`;
      const days = [["일","월","화","수","목","금","토"]];

      let row = new Array(7).fill("");
      let start = date.getDay();

      for(let i = 0; i < start; i++) row[i] = "";

      let day = 1;
      const lastDay = new Date(year, month, 0).getDate();

      while(true){
        if(start === 7){
          days.push(row);
          row = new Array(7).fill("");
          start = 0;
        }
        row[start] = day;
        day++;
        start++;
        if(day > lastDay){
          days.push(row);
          break;
        }
      }

      return { title, days };
    }

    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth() + 1;
    let scheduleEntriesMap = loadPlanEntries();

    function renderCalendar(){
      scheduleEntriesMap = loadPlanEntries();
      const data = generateCalendar(currentYear, currentMonth);
      document.getElementById('monthTitle').innerText = data.title;

      let html = "<table><tr>";
      data.days[0].forEach(d => html += `<th>${d}</th>`);
      html += "</tr>";

      for(let i = 1; i < data.days.length; i++){
        html += "<tr>";
        data.days[i].forEach(d => {
          if(!d){
            html += `<td></td>`;
          }else{
            const dateKey = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const plans = scheduleEntriesMap[dateKey] || [];
            const hasPlans = plans.length > 0;
            const tasks = hasPlans
              ? `<ul class="task-list">${plans.map(plan => {
                  const subject = escapeHTML(plan.subject);
                  const label = escapeHTML(plan.label);
                  const detail = escapeHTML(plan.detail);
                  return `<li><strong>${subject}${label ? ` · ${label}` : ''}</strong>${detail}</li>`;
                }).join('')}</ul>`
              : '';

            html += `
              <td>
                <div class='day-box${hasPlans ? ' has-plan' : ''}' data-date='${dateKey}'>
                  <div class='day-num'>${d}</div>
                  <button class="clear-btn" type="button" onclick="clearDayPlan(event, '${dateKey}')">×</button>
                  ${tasks}
                </div>
              </td>`;
          }
        });
        html += "</tr>";
      }

      html += "</table>";
      document.getElementById('calendar').innerHTML = html;
    }

    function changeMonth(move){
      currentMonth += move;
      if(currentMonth === 0){
        currentMonth = 12;
        currentYear--;
      }else if(currentMonth === 13){
        currentMonth = 1;
        currentYear++;
      }
      renderCalendar();
    }

    renderCalendar();

    window.addEventListener('storage', (event) => {
      if(event.key === PLAN_STORAGE_KEY){
        scheduleEntriesMap = loadPlanEntries();
        renderCalendar();
      }
    });

    window.changeMonth = changeMonth;
    window.clearDayPlan = function(event, dateKey){
      event.stopPropagation();
      const raw = localStorage.getItem(PLAN_STORAGE_KEY);
      if(!raw){
        scheduleEntriesMap = {};
        renderCalendar();
        return;
      }

      try{
        const plans = JSON.parse(raw);
        if(!Array.isArray(plans)){ return; }

        const updated = plans.map(plan => {
          if(!plan || !Array.isArray(plan.scheduleEntries)){
            return plan;
          }

          const filteredEntries = plan.scheduleEntries.filter(entry => entry && entry.date !== dateKey);
          return {
            ...plan,
            scheduleEntries: filteredEntries
          };
        }).filter(plan => {
          if(!plan || !Array.isArray(plan.scheduleEntries)){
            return true;
          }
          if(plan.scheduleEntries.length > 0){
            return true;
          }
          return plan.type !== 'calc';
        });

        localStorage.setItem(PLAN_STORAGE_KEY, JSON.stringify(updated));
        scheduleEntriesMap = loadPlanEntries();
        renderCalendar();
      }catch(error){
        console.error('학습 계획 삭제 중 오류가 발생했습니다:', error);
      }
    }
  </script>

</body>
</html>
