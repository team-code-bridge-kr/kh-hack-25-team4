<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllOfUs - 로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(102, 126, 234, 0.08);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background: rgba(102, 126, 234, 0.16);
            color: #4c5bd4;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: -1px;
            color: #333;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group input::placeholder {
            color: #999;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #999;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            padding: 0 15px;
            font-size: 14px;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        #user-info {
            text-align: center;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 30px;
            }

            .logo h1 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="main.html" class="back-link" aria-label="대시보드로 돌아가기">← 돌아가기</a>

        <div class="logo">
            <h1>AllOfUs</h1>
        </div>
        
        <div id="user-info" class="hidden"></div>
        
        <div class="input-group">
            <input type="email" placeholder="이메일" id="email">
        </div>
        
        <div class="input-group">
            <input type="password" placeholder="비밀번호" id="password">
        </div>
        
        <button class="login-btn" id="login">로그인</button>
        
        <div class="divider">
            <span>또는</span>
        </div>
        
        <div class="signup-link">
            계정이 없으신가요? <a href="sign.html">회원가입</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        // 'createUserWithEmailAndPassword'는 회원가입용이므로 로그인 페이지에서는 제거
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";
        // 'set'은 데이터 저장용이므로 로그인 페이지에서는 제거 (get, child는 displayName에서 사용)
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js";
        // Firestore 관련 기능은 회원가입용이므로 로그인 페이지에서는 제거
        // import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD1HNrS-TcAUvmJvWJYowzIPbyIC1_sMjg",
          authDomain: "hack-7974a.firebaseapp.com",
          projectId: "hack-7974a",
          storageBucket: "hack-7974a.firebasestorage.app",
          messagingSenderId: "831807416935",
          appId: "1:831807416935:web:461949fd6baa1510e042c2",
          measurementId: "G-DKMJZBKLG2"
        };

        let app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        document.getElementById('login').addEventListener("click", async () => {
            try {
                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;

                if (!email || !password) {
                  alert("이메일과 비밀번호를 모두 입력해주세요.");
                  return;
                }

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log("로그인 성공:", userCredential.user);
                alert("로그인이 완료되었습니다.");
                displayName();
                window.location.href = "main.html"; // 로그인 성공 시 index.html로 이동

            } catch (error) {
                console.error("로그인 실패:", error);
                // 사용자에게 친절한 오류 메시지 제공
                if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                  alert("이메일 또는 비밀번호가 올바르지 않습니다.");
                } else {
                  alert("로그인에 실패했습니다: " + error.message);
                }
            }
        });

        // 'saveUserData' 함수 제거 (회원가입용)
        // 'addUser' 함수 제거 (회원가입용)

        // 로그인 성공 시 사용자 이름을 표시하는 함수 (유지)
        function displayName() {
            if (!auth.currentUser) {
                console.warn("현재 로그인된 사용자가 없습니다.");
                return;
            }
            const userId = auth.currentUser.uid;
            const userRef = ref(database, userId + '/username');
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const username = snapshot.val();
                    const userInfoDiv = document.getElementById('user-info');
                    if (userInfoDiv) {
                        userInfoDiv.textContent = `${username}님, 환영합니다!`;
                        userInfoDiv.classList.remove('hidden');
                    }
                } else {
                    console.log("사용자 데이터 없음");
                }
            }).catch((error) => {
                console.error("데이터 로드 실패:", error);
            });
        }

        // 로그아웃 함수 (유지)
        window.logout = function() {
            signOut(auth).then(() => {
                console.log("로그아웃 성공");
                alert("로그아웃되었습니다.");
                location.reload();
            }).catch((error) => {
                console.error("로그아웃 실패:", error);
            });
        };
    </script>
</body>
</html>
